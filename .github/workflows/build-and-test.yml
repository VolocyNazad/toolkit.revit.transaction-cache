name: Build and test

on:
  push:
    branches:
    - main
    - dev
  pull_request:

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ContinuousIntegrationBuild: true

jobs:
  build:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      matrix:
        configuration: [
          "Release_2021.1.100", "Release_2022.1.80", "Release_2023.1.90", "Release_2024.3.60",
          "Release_2025.4.60", "Release_2026.4.10", "Release_2027.3.0"
        ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5.4.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: |
          global.json
          **/Directory.Packages.props
          NuGet.config
    - name: Execute build and run tests
      run: |
        dotnet build --configuration "${{ matrix.configuration }}" -p:Platform=x64 -p:TreatWarningsAsErrors=true -p:EnforcePublicApiDocumentation=true /nologo

        # Run every headless test project (*.Tests.csproj); *.RevitTests.csproj projects (e.g.
        # Revit.TransactionMemoryCache.RevitTests, which needs Nice3point.TUnit.Revit's
        # RevitApiTest) need a locally installed, licensed Revit process to execute and are not
        # runnable on a hosted GitHub Actions runner, so they are excluded here (they are still
        # built above).
        $testProjects = Get-ChildItem -Recurse -Filter *.csproj |
          Where-Object { $_.Name -match '\.Tests\.csproj$' -and $_.Name -notmatch 'RevitTests' }

        foreach ($project in $testProjects) {
          dotnet test --project $project.FullName --configuration "${{ matrix.configuration }}"
        }
    - name: Upload artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: VolocyNazad.Revit.TransactionMemoryCache-${{ matrix.configuration }}
        path: artifacts/*
